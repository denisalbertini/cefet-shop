<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cefet Shop</title>
    <script src="./src/index.ts" type="module" defer></script>
    <style>
      .logo-cefet {
        width: 8em;
      }

      .badge-circle {
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 50%;
        width: 1.2em;
        height: 1.2em;
        font-size: 0.5em;
      }

      .pointer {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container-fluid">
      <header class="border-bottom border-black border-2">
        <div class="row align-items-center">
          <div class="col-4 d-flex justify-content-end">
            <img
              src="./src/img/vert_azul.png"
              alt="Logo Cefet"
              class="img-fluid logo-cefet"
            />
          </div>

          <div class="col-4 d-flex justify-content-center">
            <h1 class="align-self-center mx-5">
              <a id="titulo" href="/" class="text-decoration-none text-reset"
                >Cefet Shop</a
              >
            </h1>
          </div>

          <div class="col-2 d-flex justify-content-center">
            <button id="login" class="btn btn-light border">Login</button>

            <div class="dropdown d-none">
              <button
                class="btn btn-secondary dropdown-toggle"
                type="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Olá <span id="nome-usuario"></span>
              </button>
              <ul id="menu-usuario" class="dropdown-menu">
                <li id="item-suas-compras">
                  <a
                    class="dropdown-item d-flex align-items-center"
                    href="#"
                    role="button"
                    id="compras"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="16"
                      height="16"
                      fill="currentColor"
                      class="bi bi-bag-check"
                      viewBox="0 0 16 16"
                    >
                      <path
                        fill-rule="evenodd"
                        d="M10.854 8.146a.5.5 0 0 1 0 .708l-3 3a.5.5 0 0 1-.708 0l-1.5-1.5a.5.5 0 0 1 .708-.708L7.5 10.793l2.646-2.647a.5.5 0 0 1 .708 0"
                      />
                      <path
                        d="M8 1a2.5 2.5 0 0 1 2.5 2.5V4h-5v-.5A2.5 2.5 0 0 1 8 1m3.5 3v-.5a3.5 3.5 0 1 0-7 0V4H1v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V4zM2 5h12v9a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"
                      />
                    </svg>
                    <p class="m-0 ps-2">Suas Compras</p>
                  </a>
                </li>
                <li id="item-relatorios" class="d-none">
                  <a
                    class="dropdown-item d-flex align-items-center"
                    href="#"
                    role="button"
                    id="relatorios"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="16"
                      height="16"
                      fill="currentColor"
                      class="bi bi-card-list"
                      viewBox="0 0 16 16"
                    >
                      <path
                        d="M14.5 3a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-.5.5h-13a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5zm-13-1A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h13a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 14.5 2z"
                      />
                      <path
                        d="M5 8a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7A.5.5 0 0 1 5 8m0-2.5a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5m0 5a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5m-1-5a.5.5 0 1 1-1 0 .5.5 0 0 1 1 0M4 8a.5.5 0 1 1-1 0 .5.5 0 0 1 1 0m0 2.5a.5.5 0 1 1-1 0 .5.5 0 0 1 1 0"
                      />
                    </svg>
                    <p class="m-0 ps-2">Relatórios</p>
                  </a>
                </li>
                <li>
                  <a
                    class="dropdown-item d-flex align-items-center"
                    href="#"
                    role="button"
                    id="logout"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="16"
                      height="16"
                      fill="currentColor"
                      class="bi bi-door-closed"
                      viewBox="0 0 16 16"
                    >
                      <path
                        d="M3 2a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v13h1.5a.5.5 0 0 1 0 1h-13a.5.5 0 0 1 0-1H3zm1 13h8V2H4z"
                      />
                      <path d="M9 9a1 1 0 1 0 2 0 1 1 0 0 0-2 0" />
                    </svg>
                    <p class="m-0 ps-2">Logout</p>
                  </a>
                </li>
              </ul>
            </div>
          </div>

          <div class="col-2 d-flex justify-content-start">
            <a
              id="carrinho"
              href="/carrinho"
              class="icon-link fs-1 text-decoration-none position-relative"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                fill="currentColor"
                class="bi bi-cart4"
                viewBox="0 0 16 16"
              >
                <path
                  d="M0 2.5A.5.5 0 0 1 .5 2H2a.5.5 0 0 1 .485.379L2.89 4H14.5a.5.5 0 0 1 .485.621l-1.5 6A.5.5 0 0 1 13 11H4a.5.5 0 0 1-.485-.379L1.61 3H.5a.5.5 0 0 1-.5-.5M3.14 5l.5 2H5V5zM6 5v2h2V5zm3 0v2h2V5zm3 0v2h1.36l.5-2zm1.11 3H12v2h.61zM11 8H9v2h2zM8 8H6v2h2zM5 8H3.89l.5 2H5zm0 5a1 1 0 1 0 0 2 1 1 0 0 0 0-2m-2 1a2 2 0 1 1 4 0 2 2 0 0 1-4 0m9-1a1 1 0 1 0 0 2 1 1 0 0 0 0-2m-2 1a2 2 0 1 1 4 0 2 2 0 0 1-4 0"
                />
              </svg>

              <span
                id="badge"
                class="badge-circle bg-danger position-absolute top-0 start-100 translate-middle text-white invisible"
              ></span
            ></a>
          </div>
        </div>
      </header>

      <main></main>
    </div>
  </body>
</html>
