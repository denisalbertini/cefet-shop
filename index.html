<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cefet Shop</title>
        <script src="./src/index.ts" type="module" defer></script>
        <style>
            .logo-cefet {
                width: 8em;
            }

            .badge-circle {
                display: flex;
                justify-content: center;
                align-items: center;
                border-radius: 50%;
                width: 1.2em;
                height: 1.2em;
                font-size: 0.5em;
            }

            .pointer {
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <div class="container-fluid">
            <header class="border-bottom border-black border-2">
                <div class="row align-items-center">
                    <div class="col-4 d-flex justify-content-end">
                        <img
                            src="./src/img/vert_azul.png"
                            alt="Logo Cefet"
                            class="img-fluid logo-cefet"
                        />
                    </div>

                    <div class="col-4 d-flex justify-content-center">
                        <h1 class="align-self-center mx-5">
                            <a id="titulo" href="/" class="text-decoration-none text-reset"
                                >Cefet Shop</a
                            >
                        </h1>
                    </div>

                    <div class="col-2 d-flex justify-content-center">
                        <a id="login" href="#">Login</a>
                    </div>

                    <div class="col-2 d-flex justify-content-start">
                        <a
                            id="carrinho"
                            href="/carrinho"
                            class="icon-link fs-1 text-decoration-none position-relative"
                        >
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="16"
                                height="16"
                                fill="currentColor"
                                class="bi bi-cart4"
                                viewBox="0 0 16 16"
                            >
                                <path
                                    d="M0 2.5A.5.5 0 0 1 .5 2H2a.5.5 0 0 1 .485.379L2.89 4H14.5a.5.5 0 0 1 .485.621l-1.5 6A.5.5 0 0 1 13 11H4a.5.5 0 0 1-.485-.379L1.61 3H.5a.5.5 0 0 1-.5-.5M3.14 5l.5 2H5V5zM6 5v2h2V5zm3 0v2h2V5zm3 0v2h1.36l.5-2zm1.11 3H12v2h.61zM11 8H9v2h2zM8 8H6v2h2zM5 8H3.89l.5 2H5zm0 5a1 1 0 1 0 0 2 1 1 0 0 0 0-2m-2 1a2 2 0 1 1 4 0 2 2 0 0 1-4 0m9-1a1 1 0 1 0 0 2 1 1 0 0 0 0-2m-2 1a2 2 0 1 1 4 0 2 2 0 0 1-4 0"
                                />
                            </svg>

                            <span
                                id="badge"
                                class="badge-circle bg-danger position-absolute top-0 start-100 translate-middle text-white invisible"
                                >0</span
                            ></a
                        >
                    </div>
                </div>
            </header>

            <main></main>
        </div>
    </body>
</html>
