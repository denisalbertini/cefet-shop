<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Carrinho</title>
    </head>
    <body>
        <div class="container-fluid">
            <template id="item"
                ><li class="list-group-item">
                    <input class="produtoId" type="hidden" />

                    <div class="row g-3">
                        <div class="col-12 col-lg-7">
                            <div class="d-flex">
                                <img
                                    src="https://placehold.co/100"
                                    alt="Imagem do produto"
                                    class="produtoFoto img-fluid"
                                    style="width: auto; height: 8rem"
                                />

                                <h6 class="produtoNome ps-2">Nome do produto</h6>
                            </div>
                        </div>

                        <div class="col mt-4">
                            <div class="row">
                                <div class="col d-flex flex-column justify-content-center">
                                    <input
                                        type="number"
                                        class="quantidade form-control"
                                        style="width: 5em"
                                    />

                                    <p class="m-0 mt-2">
                                        Subtotal: C$ <span class="subTotal"></span>
                                    </p>
                                </div>

                                <div class="col-4 d-flex justify-content-center p-0">
                                    <button class="remover btn btn-outline-danger m-auto p-1">
                                        <svg
                                            xmlns="http://www.w3.org/2000/svg"
                                            width="16"
                                            height="16"
                                            fill="currentColor"
                                            class="bi bi-x-circle"
                                            viewBox="0 0 16 16"
                                        >
                                            <path
                                                d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"
                                            />
                                            <path
                                                d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"
                                            />
                                        </svg>
                                        Remover
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </li></template
            >

            <div class="row mt-5">
                <div class="col-xl-1 col-xxl-3"></div>

                <div class="col">
                    <div class="row g-4">
                        <div class="col-12 col-lg-9">
                            <ul id="lista" class="list-group"></ul>
                        </div>

                        <div class="col">
                            <div class="card">
                                <div class="card-body">
                                    <h5 class="card-title text-center">
                                        Total: C$ <span id="total"></span>
                                    </h5>

                                    <button
                                        id="finalizar"
                                        class="btn btn-primary w-100 align-self-center mt-5"
                                    >
                                        <svg
                                            xmlns="http://www.w3.org/2000/svg"
                                            width="16"
                                            height="16"
                                            fill="currentColor"
                                            class="bi bi-check-lg"
                                            viewBox="0 0 16 16"
                                        >
                                            <path
                                                d="M12.736 3.97a.733.733 0 0 1 1.047 0c.286.289.29.756.01 1.05L7.88 12.01a.733.733 0 0 1-1.065.02L3.217 8.384a.757.757 0 0 1 0-1.06.733.733 0 0 1 1.047 0l3.052 3.093 5.4-6.425z"
                                            />
                                        </svg>
                                        Finalizar Compra
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-xl-1 col-xxl-3"></div>
            </div>
        </div>
    </body>
</html>
