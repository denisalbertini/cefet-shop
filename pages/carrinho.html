<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrinho</title>
    <style>
      .quantidade {
        width: 5em;
      }

      .foto {
        width: auto;
        height: 8rem;
      }
    </style>
  </head>
  <body>
    <template id="item"
      ><li class="list-group-item">
        <input class="produto-id" type="hidden" />

        <div class="row g-3">
          <div class="col-12 col-lg-7">
            <div class="d-flex">
              <img
                src="https://placehold.co/100"
                alt="Foto do produto"
                class="foto img-fluid"
              />

              <h6 class="nome ps-2">Nome do produto</h6>
            </div>
          </div>

          <div class="col mt-4">
            <div class="row">
              <div class="col d-flex flex-column justify-content-center">
                <input type="number" class="quantidade form-control" />

                <p class="m-0 mt-2">
                  Subtotal: C$ <span class="sub-total"></span>
                </p>
              </div>

              <div class="col-4 d-flex justify-content-center p-0">
                <button class="remover btn btn-outline-danger m-auto p-1">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="16"
                    height="16"
                    fill="currentColor"
                    class="bi bi-x-circle"
                    viewBox="0 0 16 16"
                  >
                    <path
                      d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"
                    />
                    <path
                      d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"
                    />
                  </svg>
                  Remover
                </button>
              </div>
            </div>
          </div>
        </div>
      </li></template
    >

    <div class="row mt-5">
      <div class="col-xl-1 col-xxl-3"></div>

      <div class="col">
        <div class="row g-4">
          <div class="col-12 col-lg-9">
            <template id="alerta"
              ><div
                class="alert alert-danger d-flex align-items-center alert-dismissible fade show mt-4"
                role="alert"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  fill="currentColor"
                  class="bi bi-exclamation-triangle-fill"
                  viewBox="0 0 16 16"
                >
                  <path
                    d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5m.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2"
                  />
                </svg>

                <p class="m-0 ps-2 msg-erro"></p>

                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="alert"
                  aria-label="Close"
                ></button></div
            ></template>

            <div id="alertas" class="mb-4 mx-auto d-none"></div>

            <ul id="lista" class="list-group"></ul>
          </div>

          <div class="col">
            <div class="card">
              <div class="card-body">
                <h5 class="card-title text-center">
                  Total: C$ <span id="total"></span>
                </h5>

                <button
                  id="finalizar"
                  class="btn btn-primary w-100 align-self-center mt-5"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="16"
                    height="16"
                    fill="currentColor"
                    class="bi bi-check-lg"
                    viewBox="0 0 16 16"
                  >
                    <path
                      d="M12.736 3.97a.733.733 0 0 1 1.047 0c.286.289.29.756.01 1.05L7.88 12.01a.733.733 0 0 1-1.065.02L3.217 8.384a.757.757 0 0 1 0-1.06.733.733 0 0 1 1.047 0l3.052 3.093 5.4-6.425z"
                    />
                  </svg>
                  Finalizar Compra
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-xl-1 col-xxl-3"></div>
    </div>
  </body>
</html>
