<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compra Finalizada</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="container-fluid">
      <div class="row mt-5">
        <div class="col"></div>

        <div
          class="col-10 col-sm-9 col-md-8 col-lg-7 col-xl-6 col-xxl-5 d-flex flex-column"
        >
          <div class="alert alert-success" role="alert">
            <h2 class="text-center">Compra Finalizada!</h2>
          </div>

          <h3 class="mt-4">
            Número da compra: #
            <span id="numero-compra"></span>
          </h3>

          <h5 class="mt-2">
            Realizada por:
            <span id="nome-usuario">Nome Completo</span>,
            <span id="data">dd-mm-AAAA H:m:s</span>.
          </h5>

          <div class="alert alert-dark mt-5" role="alert">
            Passe no Almoxerifado do Cefet das 9h às 18h para resgatar os
            produtos, em posse do número da compra e identidade.
          </div>

          <h4 class="mt-5">Itens:</h4>

          <template id="item"
            ><li class="list-group-item">
              <div class="row">
                <div class="col-2 border-end">
                  <img
                    src="https://placehold.co/400x500"
                    alt="Imagem do produto"
                    class="img-fluid foto"
                  />
                </div>

                <div class="col nome border-end">Nome do produto</div>

                <div class="col-2 border-end">
                  x<span class="quantidade">0</span>
                </div>

                <div class="col-3">
                  Subtotal: C$ <span class="sub-total">0,00</span>
                </div>
              </div>
            </li></template
          >

          <ul class="list-group" id="itens"></ul>

          <h4>Total: C$ <span id="total">0,00</span>:</h4>

          <div class="d-flex justify-content-center">
            <button class="btn btn-primary mt-5">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                fill="currentColor"
                class="bi bi-printer-fill"
                viewBox="0 0 16 16"
              >
                <path
                  d="M5 1a2 2 0 0 0-2 2v1h10V3a2 2 0 0 0-2-2zm6 8H5a1 1 0 0 0-1 1v3a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-3a1 1 0 0 0-1-1"
                />
                <path
                  d="M0 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-1v-2a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v2H2a2 2 0 0 1-2-2zm2.5 1a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1"
                />
              </svg>
              Imprimir
            </button>
          </div>
        </div>

        <div class="col"></div>
      </div>
    </div>
  </body>
</html>
