<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cefet Shop</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <style>
      .logo-cefet {
        width: 8em;
      }

      .badge-circle {
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 50%;
        width: 1.2em;
        height: 1.2em;
        font-size: 0.5em;
      }
    </style>
  </head>
  <body>
    <div class="container-fluid">
      <header class="border-bottom border-black border-2">
        <div class="row align-items-center">
          <div class="col-4 d-flex justify-content-end">
            <img
              src="./vert_azul.png"
              alt="Logo Cefet"
              class="img-fluid logo-cefet"
            />
          </div>

          <div class="col-4 d-flex justify-content-center">
            <h1 class="align-self-center mx-5">Cefet Shop</h1>
          </div>

          <div class="col-2 d-flex justify-content-center">
            <a href="#">Login</a>
          </div>

          <div class="col-2 d-flex justify-content-start">
            <a
              href="#"
              class="icon-link fs-1 text-decoration-none position-relative"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                fill="currentColor"
                class="bi bi-cart4"
                viewBox="0 0 16 16"
              >
                <path
                  d="M0 2.5A.5.5 0 0 1 .5 2H2a.5.5 0 0 1 .485.379L2.89 4H14.5a.5.5 0 0 1 .485.621l-1.5 6A.5.5 0 0 1 13 11H4a.5.5 0 0 1-.485-.379L1.61 3H.5a.5.5 0 0 1-.5-.5M3.14 5l.5 2H5V5zM6 5v2h2V5zm3 0v2h2V5zm3 0v2h1.36l.5-2zm1.11 3H12v2h.61zM11 8H9v2h2zM8 8H6v2h2zM5 8H3.89l.5 2H5zm0 5a1 1 0 1 0 0 2 1 1 0 0 0 0-2m-2 1a2 2 0 1 1 4 0 2 2 0 0 1-4 0m9-1a1 1 0 1 0 0 2 1 1 0 0 0 0-2m-2 1a2 2 0 1 1 4 0 2 2 0 0 1-4 0"
                />
              </svg>

              <span
                class="badge badge-circle bg-danger position-absolute top-0 start-100 translate-middle"
                >1</span
              ></a
            >
          </div>
        </div>
      </header>

      <template id="card"
        ><div class="col">
          <div class="card">
            <img
              src="https://placehold.co/400x500"
              alt="Produto"
              class="card-img-top"
            />

            <div class="card-body">
              <h5 class="card-title d-flex justify-content-center">
                Nome do produto
              </h5>

              <p class="card-text d-flex justify-content-end">
                Preço sem desconto
              </p>

              <p class="card-text d-flex justify-content-end">Preço</p>

              <button class="btn btn-primary w-100 text-center">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  fill="currentColor"
                  class="bi bi-plus-circle"
                  viewBox="0 0 16 16"
                >
                  <path
                    d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"
                  />
                  <path
                    d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"
                  />
                </svg>
                Detalhes
              </button>
            </div>
          </div>
        </div></template
      >

      <div class="row mt-5">
        <div class="col-lg-3"></div>

        <div class="col">
          <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>
        </div>

        <div class="col-lg-3"></div>
      </div>
    </div>

    <template id="pagina"
      ><li class="page-item">
        <a class="page-link" href="#">Número da página</a>
      </li></template
    >

    <nav aria-label="Page navigation" class="mt-5">
      <ul class="pagination justify-content-center">
        <li class="page-item">
          <a class="page-link" href="#" aria-label="Previous">
            <span aria-hidden="true">&laquo;</span>
          </a>
        </li>
        <li class="page-item">
          <a class="page-link" href="#" aria-label="Next">
            <span aria-hidden="true">&raquo;</span>
          </a>
        </li>
      </ul>
    </nav>
  </body>
</html>
