<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compras Realizadas</title>
    <style>
      .foto {
        height: 6rem;
      }
    </style>
  </head>
  <body>
    <div class="container-fluid">
      <div class="row my-5">
        <div class="col"></div>

        <div
          class="col-10 col-sm-9 col-md-8 col-lg-7 col-xl-6 col-xxl-5 d-flex flex-column"
        >
          <div
            class="alert alert-light d-flex flex-column align-items-center d-none"
            role="alert"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="48"
              height="48"
              fill="currentColor"
              class="bi bi-bag-x"
              viewBox="0 0 16 16"
            >
              <path
                fill-rule="evenodd"
                d="M6.146 8.146a.5.5 0 0 1 .708 0L8 9.293l1.146-1.147a.5.5 0 1 1 .708.708L8.707 10l1.147 1.146a.5.5 0 0 1-.708.708L8 10.707l-1.146 1.147a.5.5 0 0 1-.708-.708L7.293 10 6.146 8.854a.5.5 0 0 1 0-.708"
              />
              <path
                d="M8 1a2.5 2.5 0 0 1 2.5 2.5V4h-5v-.5A2.5 2.5 0 0 1 8 1m3.5 3v-.5a3.5 3.5 0 1 0-7 0V4H1v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V4zM2 5h12v9a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"
              />
            </svg>

            <h2>Nenhuma compra realizada!</h2>
          </div>

          <div id="listagem-compras">
            <h2 class="text-center">Compras Realizadas</h2>

            <h3 class="mt-5 border rounded p-4">
              Total gasto: C$ <span id="total-gasto"></span>
            </h3>

            <div class="accordion mt-3 g-3" id="lista-compras"></div>
          </div>
        </div>

        <div class="col"></div>
      </div>
    </div>

    <template id="compra"
      ><div class="accordion-item">
        <h2 class="accordion-header">
          <button
            class="accordion-button collapsed fs-5"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#1"
            aria-expanded="false"
            aria-controls="1"
          >
            <span>#</span><span class="numero-compra"></span
            ><span class="mx-2">/</span>
            <span class="data-compra"></span>
          </button>
        </h2>

        <div
          id="1"
          class="accordion-collapse collapse expansao"
          data-bs-parent="#compras"
        >
          <div class="accordion-body">
            <p class="border-bottom p-2 fs-5">
              Total: C$ <span class="total fs-5">0,00</span>
            </p>

            <ul class="list-group itens"></ul>
          </div>
        </div></div
    ></template>

    <template id="item"
      ><li class="list-group-item">
        <div class="row">
          <div class="col-2 border-end">
            <img
              src="https://placehold.co/400x500"
              alt="Imagem do produto"
              class="img-fluid foto-produto"
            />
          </div>

          <div class="col border-end">
            <span class="nome-produto">Nome do produto</span>
          </div>

          <div class="col-2 border-end">x<span class="quantidade">0</span></div>

          <div class="col-3">
            Subtotal: C$ <span class="subtotal">0,00</span>
          </div>
        </div>
      </li></template
    >
  </body>
</html>
