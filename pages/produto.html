<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Produto</title>
    <style>
      #quantidade {
        width: 5em;
      }

      #foto {
        height: 30rem;
      }
    </style>
  </head>
  <body>
    <div class="row mt-5">
      <div class="col"></div>

      <div class="col-md-11 col-lg-9 col-xl-8 col-xxl-6">
        <div class="card p-2">
          <input type="hidden" id="produto-id" />

          <div class="row g-0">
            <div class="col-12 col-sm">
              <img
                id="foto"
                src="https://placehold.co/400x500"
                alt="Foto do produto"
                class="img-fluid rounded-start"
              />
            </div>

            <div class="col">
              <div
                class="card-body h-100 d-flex flex-column justify-content-between"
              >
                <div class="d-flex flex-column">
                  <h3 id="nome" class="card-title d-flex">Nome do produto</h3>

                  <h4 id="lancamento" class="card-subtitle d-flex">
                    Período de lançamento
                  </h4>
                </div>

                <p id="descricao" class="card-text d-flex">Descrição</p>

                <div class="d-flex flex-column">
                  <p class="card-text d-flex">
                    C$ <span id="preco-sem-desconto"></span>
                  </p>

                  <p class="card-text d-flex fs-5">
                    C$ <span id="preco" class="fs-5"></span>
                  </p>
                </div>

                <div class="d-flex me-auto p-2">
                  <label
                    for="quantidade"
                    class="form-label align-self-center pe-2"
                    >Quantidade:</label
                  >
                  <input id="quantidade" type="number" class="form-control" />
                </div>

                <div class="row g-2">
                  <div class="col-12 col-lg">
                    <button id="adicionar" class="btn btn-primary w-100">
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="16"
                        height="16"
                        fill="currentColor"
                        class="bi bi-cart-plus"
                        viewBox="0 0 16 16"
                      >
                        <path
                          d="M9 5.5a.5.5 0 0 0-1 0V7H6.5a.5.5 0 0 0 0 1H8v1.5a.5.5 0 0 0 1 0V8h1.5a.5.5 0 0 0 0-1H9z"
                        />
                        <path
                          d="M.5 1a.5.5 0 0 0 0 1h1.11l.401 1.607 1.498 7.985A.5.5 0 0 0 4 12h1a2 2 0 1 0 0 4 2 2 0 0 0 0-4h7a2 2 0 1 0 0 4 2 2 0 0 0 0-4h1a.5.5 0 0 0 .491-.408l1.5-8A.5.5 0 0 0 14.5 3H2.89l-.405-1.621A.5.5 0 0 0 2 1zm3.915 10L3.102 4h10.796l-1.313 7zM6 14a1 1 0 1 1-2 0 1 1 0 0 1 2 0m7 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0"
                        />
                      </svg>
                      Adicionar ao Carrinho
                    </button>

                    <button
                      id="esgotado"
                      class="btn btn-danger w-100 disabled d-none"
                    >
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="16"
                        height="16"
                        fill="currentColor"
                        class="bi bi-x-circle"
                        viewBox="0 0 16 16"
                      >
                        <path
                          d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"
                        />
                        <path
                          d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"
                        />
                      </svg>
                      Esgotado
                    </button>
                  </div>

                  <div class="col">
                    <button id="ir-para-carrinho" class="btn btn-success w-100">
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="16"
                        height="16"
                        fill="currentColor"
                        class="bi bi-cart-check"
                        viewBox="0 0 16 16"
                      >
                        <path
                          d="M11.354 6.354a.5.5 0 0 0-.708-.708L8 8.293 6.854 7.146a.5.5 0 1 0-.708.708l1.5 1.5a.5.5 0 0 0 .708 0z"
                        />
                        <path
                          d="M.5 1a.5.5 0 0 0 0 1h1.11l.401 1.607 1.498 7.985A.5.5 0 0 0 4 12h1a2 2 0 1 0 0 4 2 2 0 0 0 0-4h7a2 2 0 1 0 0 4 2 2 0 0 0 0-4h1a.5.5 0 0 0 .491-.408l1.5-8A.5.5 0 0 0 14.5 3H2.89l-.405-1.621A.5.5 0 0 0 2 1zm3.915 10L3.102 4h10.796l-1.313 7zM6 14a1 1 0 1 1-2 0 1 1 0 0 1 2 0m7 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0"
                        />
                      </svg>
                      Ir para o Carrinho
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="col"></div>
    </div>
  </body>
</html>
