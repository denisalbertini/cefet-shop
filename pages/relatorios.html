<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relatórios</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"

      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="container-fluid">
      <div class="row mt-5">
        <div class="col"></div>

        <div class="col-10 col-sm-9 col-md-8 col-lg-7 col-xl-6 col-xxl-5">
          <h2 class="text-center">Relatórios</h2>

          <div

            <div class="d-flex mb-2 mb-sm-0">
              <label for="inicio" class="form-label m-auto pe-2"
                >Início:
              </label>
              <input type="date" class="form-control me-2" />
            </div>

            <div class="d-flex mb-2 mb-sm-0">
              <label for="fim" class="form-label m-auto pe-2">Fim: </label>
              <input type="date" class="form-control me-2" />
            </div>

            <div class="d-flex justify-content-center">
              <button class="btn btn-primary">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  fill="currentColor"
                  class="bi bi-gear"

                Gerar
              </button>
            </div>
          </div>
        </div>

        <div class="col"></div>
      </div>

      <div class="row mt-5">
        <div class="col"></div>

        <div class="col-10 col-sm-9 col-md-8 col-lg-7 col-xl-6 col-xxl-5">
          <h2 class="text-center invisible">Vendas</h2>

          <div id="grafico-barras"></div>

          <table id="tabela-vendas" class="table table-striped">
            <thead></thead>
            <tbody></tbody>
          </table>

          <h2 class="text-center mt-5 invisible">Top 10 produtos</h2>

          <div id="grafico-pizza"></div>

          <table id="tabela-produtos" class="table table-striped">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>

        <div class="col"></div>
      </div>
    </div>

</html>
