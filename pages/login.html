<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
  </head>
  <body>
    <div class="container-fluid">
      <div class="row mt-5">
        <div class="col"></div>

        <div
          class="col-8 col-sm-7 col-md-6 col-lg-5 col-xl-4 col-xxl-3 d-flex flex-column border rounded p-4"
        >
          <form>
            <h2 class="text-center">Login</h2>

            <div class="mt-5">
              <label for="identificador" class="form-label"
                >Matrícula ou Email</label
              >
              <input
                type="text"
                class="form-control"
                name="identificador"
                id="identificador"
              />
            </div>

            <div class="mt-3">
              <label for="senha" class="form-label">Senha</label>
              <input
                type="password"
                class="form-control"
                name="senha"
                id="senha"
              />
            </div>

            <div id="alertas"></div>

            <div class="mt-4 d-flex justify-content-center">
              <button class="btn btn-primary" id="entrar">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  fill="currentColor"
                  class="bi bi-door-open-fill"
                  viewBox="0 0 16 16"
                >
                  <path
                    d="M1.5 15a.5.5 0 0 0 0 1h13a.5.5 0 0 0 0-1H13V2.5A1.5 1.5 0 0 0 11.5 1H11V.5a.5.5 0 0 0-.57-.495l-7 1A.5.5 0 0 0 3 1.5V15zM11 2h.5a.5.5 0 0 1 .5.5V15h-1zm-2.5 8c-.276 0-.5-.448-.5-1s.224-1 .5-1 .5.448.5 1-.224 1-.5 1"
                  />
                </svg>
                Entrar
              </button>
            </div>
          </form>
        </div>

        <div class="col"></div>
      </div>
    </div>

    <template
      ><div
        class="alert alert-danger d-flex align-items-center alert-dismissible fade show mt-4"
        role="alert"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          fill="currentColor"
          class="bi bi-exclamation-triangle-fill"
          viewBox="0 0 16 16"
        >
          <path
            d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5m.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2"
          />
        </svg>

        <p class="m-0 ps-2" id="msg-erro"></p>

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
          aria-label="Close"
        ></button></div
    ></template>
  </body>
</html>
